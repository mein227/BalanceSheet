name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src _site/
          # GitHub Pages 快取 10 分鐘；加上版本參數，避免新 HTML 搭配舊 JS（單位換算會錯）
          VERSION="${GITHUB_SHA::8}"
          sed -i -E "s#\"(src/[a-z]+\.(js|css))\"#\"\1?v=${VERSION}\"#g" _site/index.html
          sed -i -E "s#from '(\./[a-z]+\.js)'#from '\1?v=${VERSION}'#g" _site/src/*.js
          grep -c "?v=${VERSION}" _site/index.html _site/src/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
